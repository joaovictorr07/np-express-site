<article
  class="surface-panel card-glass-premium group h-full border-white/8 bg-linear-to-br from-[rgba(12,15,24,0.92)] via-[rgba(10,12,19,0.96)] to-[rgba(12,15,24,0.92)] p-6 md:p-7"
>
  <div
    class="mb-5 inline-flex h-12 w-12 items-center justify-center rounded-2xl border border-[rgba(121,236,255,0.14)] bg-linear-to-br from-[rgba(121,236,255,0.22)] to-[rgba(31,197,178,0.12)] text-[var(--color-brand-cyan)] transition-transform duration-300 group-hover:scale-105"
    aria-hidden="true"
  >
    <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current stroke-2">
      @switch (icon()) {
        @case ('contact') {
          <path d="M5 6h14v10H8l-3 3z" />
          <path d="M9 10h6M9 13h4" />
        }
        @case ('flexibility') {
          <path d="M7 7h5a5 5 0 0 1 0 10H6" />
          <path d="m9 4-3 3 3 3M15 14l3 3-3 3" />
        }
        @case ('routine') {
          <path d="M5 5h14v15H5z" />
          <path d="M8 3v4M16 3v4M8 12h3M8 16h6" />
        }
        @case ('contract') {
          <path d="M6 7h12v13H6z" />
          <path d="M9 7V5h6v2M9 11h6M9 15h4" />
        }
        @default {
          <path d="M12 3v18" />
          <path d="M5 8h14M7 16h10" />
          <path d="M8 5h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z" />
        }
      }
    </svg>
  </div>
  <div class="mb-4 flex items-center gap-3">
    <span
      class="inline-flex rounded-full border border-white/10 bg-white/[0.04] px-2.5 py-1 font-[var(--font-display)] text-[0.72rem] font-semibold tracking-[0.18em] text-[var(--color-text-muted)]"
    >
      0{{ index() }}
    </span>
    <span class="h-px flex-1 bg-linear-to-r from-white/14 to-transparent"></span>
  </div>
  <h3 class="font-[var(--font-display)] text-[1.1rem] font-semibold tracking-tight text-white md:text-[1.25rem]">
    {{ title() }}
  </h3>
  <p class="mt-3 text-sm leading-7 text-[var(--color-text-secondary)] md:text-[0.95rem]">
    {{ description() }}
  </p>
</article>
