<section [id]="sectionId" class="px-4 pt-16 md:px-6 md:pt-24">
  <div class="section-shell">
    <div appRevealOnView>
      <app-section-header
        eyebrow="Serviços"
        title="Soluções para entregas, coletas e demandas recorrentes"
        description="Serviços para resolver deslocamentos com rapidez, clareza e combinação objetiva pelo WhatsApp."
      />
    </div>

    <div class="mt-8 grid gap-5 md:mt-10 md:grid-cols-2 xl:grid-cols-3">
      @for (service of services; track service.title; let index = $index) {
        <div appRevealOnView>
          <app-service-card
            [title]="service.title"
            [description]="service.description"
            [icon]="service.icon"
            [index]="index + 1"
          />
        </div>
      }
    </div>
  </div>
</section>
