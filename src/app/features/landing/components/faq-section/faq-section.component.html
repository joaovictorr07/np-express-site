<section [id]="sectionId" class="px-4 pt-16 md:px-6 md:pt-24">
  <div
    class="section-shell overflow-hidden rounded-[2rem] border border-white/8 bg-linear-to-br from-[rgba(14,17,26,0.98)] via-[rgba(9,11,18,0.98)] to-[rgba(14,17,26,0.98)] px-5 py-7 shadow-[var(--shadow-soft)] md:px-8 md:py-10 xl:px-10"
  >
    <div class="grid gap-10 xl:grid-cols-[0.78fr_1.22fr] xl:items-start">
      <div appRevealOnView class="xl:sticky xl:top-24">
        <app-section-header
          [eyebrow]="sectionInfo.eyebrow"
          [title]="sectionInfo.title"
          [description]="sectionInfo.description"
        />
        <div class="mt-8 hidden xl:block">
          <div class="rounded-2xl border border-[rgba(37,211,102,0.16)] bg-[rgba(37,211,102,0.04)] p-5">
            <p class="text-xs font-semibold uppercase tracking-wider text-[var(--color-wa-green)] mb-2">Atendimento Direto</p>
            <p class="text-sm text-[var(--color-text-secondary)] leading-relaxed">
              Não encontrou a resposta para a sua dúvida? Fale diretamente com nossa equipe operacional pelo WhatsApp para suporte imediato.
            </p>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-4">
        @for (faq of faqs; track faq.question; let index = $index) {
          <div
            appRevealOnView
            [appRevealOnViewDelay]="index * 60"
            class="rounded-2xl border transition-all duration-300 bg-white/[0.02]"
            [class.border-white/12]="activeIndex() !== index"
            [class.border-[rgba(121,236,255,0.3)]]="activeIndex() === index"
            [class.bg-white/[0.045]]="activeIndex() === index"
          >
            <button
              type="button"
              class="flex w-full items-center justify-between gap-4 px-5 py-5 text-left transition-colors hover:text-white"
              (click)="toggleAccordion(index)"
              [aria-expanded]="activeIndex() === index"
            >
              <span class="font-[var(--font-display)] text-sm font-semibold md:text-base text-white">
                {{ faq.question }}
              </span>
              <span
                class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border border-white/10 bg-white/5 transition-transform duration-300 text-white"
                [class.rotate-180]="activeIndex() === index"
              >
                <svg
                  class="h-3.5 w-3.5 fill-none stroke-current stroke-2"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </span>
            </button>

            <div
              class="faq-answer-wrapper"
              [class.is-open]="activeIndex() === index"
            >
              <div class="faq-answer-content">
                <div class="px-5 pb-5 pt-1 text-sm md:text-[0.94rem] leading-relaxed text-[var(--color-text-secondary)]">
                  {{ faq.answer }}
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
