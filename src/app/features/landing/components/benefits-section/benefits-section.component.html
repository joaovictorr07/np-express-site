<section [id]="sectionId" class="px-4 pt-16 md:px-6 md:pt-24">
  <div class="section-shell">
    <div appRevealOnView>
      <app-section-header
        eyebrow="Benefícios"
        title="Uma landing feita para transmitir confiança sem cara de panfleto"
        description="A comunicação combina agilidade, organização e atendimento direto para aumentar a intenção de contato."
      />
    </div>

    <div class="mt-8 grid gap-5 md:mt-10 md:grid-cols-2 xl:grid-cols-3">
      @for (benefit of benefits; track benefit.title) {
        <div appRevealOnView>
          <app-feature-card [title]="benefit.title" [description]="benefit.description" />
        </div>
      }
    </div>
  </div>
</section>
