<header class="sticky top-0 z-30 px-3 pt-3 md:px-6 md:pt-4">
  <div
    class="section-shell surface-panel header-panel flex items-center justify-between gap-3 px-3 py-2.5 md:gap-6 md:px-6 md:py-3.5"
  >
    <a
      href="#inicio"
      class="focus-ring inline-flex items-center gap-3 rounded-full pr-2 transition-opacity duration-300 hover:opacity-90"
      aria-label="Voltar ao topo da landing da NP Express"
    >
      <span
        class="brand-mark inline-flex h-9 w-9 items-center justify-center overflow-hidden rounded-full md:h-11 md:w-11"
      >
        <img
          src="/images/brand/logo.png"
          alt="Logo da NP Express"
          class="h-full w-full object-contain"
        />
      </span>
      <span
        class="hidden font-[var(--font-display)] text-lg font-semibold tracking-tight text-white md:inline"
      >
        {{ companyName }}
      </span>
    </a>

    <nav class="hidden items-center gap-6 md:flex" aria-label="Navegação principal da landing">
      @for (item of navItems; track item.href) {
        <a
          [href]="item.href"
          class="focus-ring rounded-full px-1.5 py-1 text-sm font-semibold text-[var(--color-text-secondary)] transition-colors duration-300 hover:text-white"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <a
      [href]="whatsappHref"
      class="focus-ring inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-[rgba(37,211,102,0.25)] bg-[rgba(37,211,102,0.08)] text-[var(--color-wa-green)] transition-all duration-300 hover:-translate-y-0.5 hover:border-[rgba(37,211,102,0.4)] hover:bg-[rgba(37,211,102,0.14)] md:h-11 md:w-auto md:gap-2 md:px-4"
      aria-label="Abrir conversa da NP Express no WhatsApp"
      target="_blank"
      rel="noreferrer noopener"
    >
      <span
        class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-[rgba(37,211,102,0.18)]"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current">
          <path
            d="M19.05 4.94A9.86 9.86 0 0 0 12 2a9.94 9.94 0 0 0-8.64 14.86L2 22l5.3-1.35A9.94 9.94 0 0 0 12 22a10 10 0 0 0 10-9.99 9.92 9.92 0 0 0-2.95-7.07ZM12 20.2a8.14 8.14 0 0 1-4.15-1.13l-.3-.18-3.15.8.84-3.07-.2-.31A8.14 8.14 0 1 1 12 20.2Zm4.46-6.1c-.25-.13-1.47-.72-1.7-.8-.23-.08-.4-.13-.57.13-.17.25-.66.8-.8.96-.15.17-.3.19-.55.06-.25-.13-1.06-.39-2.02-1.24-.74-.66-1.24-1.47-1.39-1.72-.15-.25-.02-.38.11-.51.11-.1.25-.27.38-.4.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.57-1.36-.78-1.87-.21-.49-.42-.42-.57-.43l-.48-.01c-.17 0-.44.06-.66.31-.23.25-.87.85-.87 2.08s.89 2.42 1.02 2.59c.13.17 1.75 2.67 4.24 3.74.59.26 1.06.42 1.42.54.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.59.21-1.09.15-1.18-.06-.08-.23-.12-.48-.25Z"
          />
        </svg>
      </span>
      <span class="hidden text-sm font-semibold tracking-tight text-[var(--color-text-primary)] md:inline">
        Atendimento
      </span>
    </a>
  </div>
</header>
