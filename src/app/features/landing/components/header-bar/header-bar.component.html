<header class="sticky top-0 z-30 px-4 pt-4 md:px-6">
  <div
    class="section-shell surface-panel flex items-center justify-between gap-4 px-4 py-3 md:px-6 md:py-4"
  >
    <a
      href="#inicio"
      class="focus-ring inline-flex items-center gap-3 rounded-full pr-2 transition-opacity duration-300 hover:opacity-90"
      aria-label="Voltar ao topo da landing da NP Express"
    >
      <span
        class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-linear-to-br from-[var(--color-brand-red)] to-[#ff8b5b] font-[var(--font-display)] text-sm font-semibold text-slate-950"
      >
        NP
      </span>
      <span class="font-[var(--font-display)] text-lg font-semibold tracking-tight text-white">
        {{ companyName }}
      </span>
    </a>

    <nav class="hidden items-center gap-6 md:flex" aria-label="Navegação principal da landing">
      @for (item of navItems; track item.href) {
        <a
          [href]="item.href"
          class="focus-ring rounded-full px-1 py-1 text-sm font-medium text-[var(--color-text-muted)] transition-colors duration-300 hover:text-white"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <app-whatsapp-button
      label="WhatsApp"
      variant="secondary"
      size="sm"
      ariaLabel="Abrir conversa da NP Express no WhatsApp"
    />
  </div>
</header>
