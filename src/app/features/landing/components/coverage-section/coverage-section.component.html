<section [id]="sectionId" class="px-4 pt-16 md:px-6 md:pt-24">
  <div class="section-shell surface-panel overflow-hidden px-6 py-8 md:px-8 md:py-10">
    <div class="grid gap-10 lg:grid-cols-[0.95fr_1.05fr] lg:items-center">
      <div appRevealOnView>
        <app-section-header
          [eyebrow]="coverage.eyebrow"
          [title]="coverage.title"
          [description]="coverage.description"
        />

        <div class="mt-6 flex flex-wrap gap-3">
          @for (badge of coverage.badges; track badge) {
            <app-trust-badge [label]="badge" />
          }
        </div>
      </div>

      <div appRevealOnView class="grid gap-4">
        @for (bullet of coverage.bullets; track bullet) {
          <div class="rounded-3xl border border-white/10 bg-black/18 px-5 py-4">
            <div class="flex items-start gap-3">
              <span
                class="mt-1 inline-flex h-2.5 w-2.5 shrink-0 rounded-full bg-[var(--color-brand-cyan)]"
              ></span>
              <p class="text-sm leading-7 text-[var(--color-text-primary)] md:text-base">
                {{ bullet }}
              </p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
