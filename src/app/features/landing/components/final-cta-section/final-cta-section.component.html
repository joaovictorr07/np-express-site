<section [id]="sectionId" class="px-4 pt-16 md:px-6 md:pt-24">
  <div appRevealOnView class="section-shell">
    <div
      class="overflow-hidden rounded-[2rem] border border-[rgba(121,236,255,0.14)] bg-linear-to-br from-[rgba(255,91,77,0.14)] via-[rgba(17,19,28,0.98)] to-[rgba(121,236,255,0.14)] px-6 py-8 shadow-[var(--shadow-soft)] md:px-10 md:py-10"
    >
      <div class="flex flex-col gap-8 lg:flex-row lg:items-center lg:justify-between">
        <div class="max-w-2xl">
          <span class="eyebrow">{{ cta.eyebrow }}</span>
          <h2
            class="text-balance-pretty mt-5 max-w-[15ch] font-[var(--font-display)] text-3xl font-semibold tracking-tight text-white md:text-[2.65rem] md:leading-[1.04]"
          >
            {{ cta.title }}
          </h2>
          <p class="mt-4 max-w-xl text-base leading-7 text-[var(--color-text-secondary)] md:text-lg">
            {{ cta.description }}
          </p>
        </div>

        <div class="flex flex-col items-start gap-3 lg:items-end">
          <span class="text-sm font-medium text-[var(--color-text-muted)]">
            {{ cta.supportLine }}
          </span>
          <app-whatsapp-button
            [label]="cta.label"
            contextTag="uma entrega urgente"
            size="lg"
            ariaLabel="Abrir conversa imediata com a NP Express no WhatsApp"
          />
        </div>
      </div>
    </div>
  </div>
</section>
