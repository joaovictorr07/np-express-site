<footer class="px-4 pb-8 md:px-6 md:pb-10">
  <div class="section-shell mt-16 border-t border-white/10 pt-8 md:mt-20 md:pt-10">
    <div class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
      <div class="max-w-xl">
        <p class="font-[var(--font-display)] text-xl font-semibold tracking-tight text-white">
          {{ companyName }}
        </p>
        <p class="mt-3 text-sm leading-6 text-[var(--color-text-muted)] md:text-base">
          {{ footerNote }}
        </p>
      </div>

      <div class="text-sm text-[var(--color-text-muted)] md:text-right">
        <p>Contato principal</p>
        <a
          [href]="phoneHref"
          class="focus-ring mt-2 inline-flex rounded-full border border-white/10 px-4 py-2 font-semibold text-white transition-colors duration-300 hover:border-[var(--color-brand-cyan)]"
          [attr.aria-label]="'Ligar para ' + primaryPhone"
        >
          {{ primaryPhone }}
        </a>
      </div>
    </div>
  </div>
</footer>
