<footer class="px-4 pb-8 md:px-6 md:pb-10">
  <div class="section-shell mt-16 border-t border-white/10 pt-8 md:mt-20 md:pt-10">
    <div class="grid gap-8 md:grid-cols-[1.2fr_0.8fr_0.8fr] md:items-start">
      <div>
        <p class="font-[var(--font-display)] text-xl font-semibold tracking-tight text-white">
          {{ companyName }}
        </p>
        <p class="mt-3 max-w-sm text-sm leading-7 text-[var(--color-text-secondary)] md:text-base">
          {{ footerNote }}
        </p>
      </div>

      <nav class="text-sm text-[var(--color-text-muted)]" aria-label="Links rápidos do rodapé">
        <p class="font-semibold text-white">Links rápidos</p>
        <div class="mt-3 grid gap-2">
          @for (item of navItems; track item.href) {
            <a
              [href]="item.href"
              class="focus-ring w-fit rounded-full py-1 transition-colors duration-300 hover:text-white"
            >
              {{ item.label }}
            </a>
          }
        </div>
      </nav>

      <div class="text-sm text-[var(--color-text-muted)] md:text-right">
        <p class="font-semibold text-white">Contato</p>
        <div class="mt-3 flex flex-wrap gap-3 md:justify-end">
          <a
            [href]="phoneHref"
            class="focus-ring inline-flex rounded-full border border-white/10 px-4 py-2 font-semibold text-white transition-colors duration-300 hover:border-[var(--color-brand-cyan)]"
            [attr.aria-label]="'Ligar para ' + primaryPhone"
          >
            {{ primaryPhone }}
          </a>
          <a
            [href]="whatsappHref"
            class="focus-ring inline-flex rounded-full border border-[rgba(37,211,102,0.25)] bg-[rgba(37,211,102,0.08)] px-4 py-2 font-semibold text-[var(--color-wa-green)] transition-colors duration-300 hover:bg-[rgba(37,211,102,0.14)]"
            aria-label="Abrir conversa da NP Express no WhatsApp"
            target="_blank"
            rel="noreferrer noopener"
          >
            WhatsApp
          </a>
          <a
            [href]="instagramHref"
            class="focus-ring inline-flex rounded-full border border-white/10 px-4 py-2 font-semibold text-white transition-colors duration-300 hover:border-[var(--color-brand-cyan)]"
            aria-label="Abrir perfil da NP Express no Instagram"
            target="_blank"
            rel="noreferrer noopener"
          >
            Instagram
          </a>
        </div>
      </div>
    </div>
  </div>
</footer>
