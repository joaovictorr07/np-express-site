<section [id]="sectionId" class="px-4 pt-16 md:px-6 md:pt-24">
  <div class="section-shell">
    <div appRevealOnView>
      <app-section-header
        eyebrow="Como funciona"
        title="Do pedido à entrega, tudo combinado com clareza"
        description="Um fluxo simples para informar a demanda, confirmar a viabilidade e seguir sem demora."
      />
    </div>

    <div class="mt-8 grid gap-5 md:mt-10 md:grid-cols-2 xl:grid-cols-4">
      @for (step of steps; track step.step) {
        <div appRevealOnView class="surface-panel px-5 py-6">
          <span class="font-[var(--font-display)] text-sm font-semibold text-[var(--color-brand-cyan)]">
            {{ step.step }}
          </span>
          <h3 class="mt-4 font-[var(--font-display)] text-lg font-semibold text-white">
            {{ step.title }}
          </h3>
          <p class="mt-3 text-sm leading-6 text-[var(--color-text-muted)]">
            {{ step.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
