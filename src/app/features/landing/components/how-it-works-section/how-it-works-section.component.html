<section [id]="sectionId" class="px-4 pt-16 md:px-6 md:pt-24">
  <div class="section-shell">
    <div appRevealOnView>
      <app-section-header
        eyebrow="Como funciona"
        title="Fluxo simples para sair da dúvida e ir direto para a execução"
        description="Toda a arquitetura da landing foi organizada para que o usuário entenda rápido o processo e clique no CTA sem atrito."
      />
    </div>

    <div class="mt-8 grid gap-5 md:mt-10 md:grid-cols-2">
      @for (step of steps; track step.step) {
        <article appRevealOnView class="surface-panel p-6 md:p-7">
          <div class="flex items-start gap-4">
            <span
              class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-linear-to-br from-[rgba(255,91,77,0.22)] to-[rgba(121,236,255,0.12)] font-[var(--font-display)] text-sm font-semibold text-white"
            >
              {{ step.step }}
            </span>
            <div>
              <h3 class="font-[var(--font-display)] text-xl font-semibold tracking-tight text-white">
                {{ step.title }}
              </h3>
              <p class="mt-3 text-sm leading-6 text-[var(--color-text-muted)] md:text-base">
                {{ step.description }}
              </p>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
