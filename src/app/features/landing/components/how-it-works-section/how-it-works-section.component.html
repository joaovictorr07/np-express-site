<section [id]="sectionId" class="px-4 pt-16 md:px-6 md:pt-24">
  <div class="section-shell">
    <div appRevealOnView>
      <app-section-header
        [eyebrow]="section.eyebrow"
        [title]="section.title"
        [description]="section.description"
      />
    </div>

    <div class="relative mt-8 md:mt-10">
      <svg
        class="pointer-events-none absolute top-10 right-[12.5%] left-[12.5%] hidden h-2 overflow-visible xl:block"
        viewBox="0 0 100 8"
        fill="none"
        preserveAspectRatio="none"
      >
        <defs>
          <linearGradient id="flow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--color-brand-teal)" stop-opacity="0.15" />
            <stop offset="25%" stop-color="var(--color-brand-cyan)" stop-opacity="0.85" />
            <stop offset="50%" stop-color="var(--color-brand-teal)" stop-opacity="0.85" />
            <stop offset="75%" stop-color="var(--color-brand-cyan)" stop-opacity="0.85" />
            <stop offset="100%" stop-color="var(--color-brand-teal)" stop-opacity="0.15" />
          </linearGradient>
        </defs>
        <!-- Background track -->
        <path
          d="M 0,4 L 100,4"
          stroke="rgba(121,236,255,0.08)"
          stroke-width="2"
          stroke-linecap="round"
        />
        <!-- Animated flow line -->
        <path
          d="M 0,4 L 100,4"
          stroke="url(#flow-gradient)"
          stroke-width="2.5"
          stroke-dasharray="6, 5"
          stroke-linecap="round"
          class="animate-marching-ants"
        />
      </svg>

      <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-4">
        @for (step of steps; track step.step; let index = $index) {
          <div
            appRevealOnView
            [appRevealOnViewDelay]="index * 90"
            class="surface-panel card-glass-premium group relative overflow-hidden px-5 pt-16 pb-6 md:px-6"
          >
            <span
              class="absolute top-5 left-5 inline-flex h-10 min-w-10 items-center justify-center rounded-full border border-[rgba(121,236,255,0.24)] bg-[rgba(121,236,255,0.1)] px-3 font-[var(--font-display)] text-sm font-semibold tracking-[0.18em] text-[var(--color-brand-cyan)] transition-all duration-300 group-hover:border-[rgba(121,236,255,0.6)] group-hover:bg-[rgba(121,236,255,0.24)] group-hover:text-white group-hover:shadow-[0_0_15px_rgba(121,236,255,0.25)]"
            >
              {{ step.step }}
            </span>
            <div class="absolute inset-x-0 top-0 h-px bg-linear-to-r from-transparent via-white/18 to-transparent"></div>
            <h3 class="font-[var(--font-display)] text-xl font-semibold tracking-tight text-white">
              {{ step.title }}
            </h3>
            <p class="mt-3 text-sm leading-7 text-[var(--color-text-secondary)] md:text-[0.95rem]">
              {{ step.description }}
            </p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
