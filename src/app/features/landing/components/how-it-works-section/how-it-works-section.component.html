<section [id]="sectionId" class="px-4 pt-16 md:px-6 md:pt-24">
  <div class="section-shell">
    <div appRevealOnView>
      <app-section-header
        [eyebrow]="section.eyebrow"
        [title]="section.title"
        [description]="section.description"
      />
    </div>

    <div class="relative mt-8 md:mt-10">
      <div
        class="pointer-events-none absolute top-9 right-0 left-0 hidden h-px bg-linear-to-r from-transparent via-[rgba(121,236,255,0.2)] to-transparent xl:block"
      ></div>

      <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-4">
        @for (step of steps; track step.step; let index = $index) {
          <div
            appRevealOnView
            [appRevealOnViewDelay]="index * 90"
            class="surface-panel group relative overflow-hidden px-5 pt-16 pb-6 transition-transform duration-300 hover:-translate-y-1 md:px-6"
          >
            <span
              class="absolute top-5 left-5 inline-flex h-10 min-w-10 items-center justify-center rounded-full border border-[rgba(121,236,255,0.24)] bg-[rgba(121,236,255,0.1)] px-3 font-[var(--font-display)] text-sm font-semibold tracking-[0.18em] text-[var(--color-brand-cyan)]"
            >
              {{ step.step }}
            </span>
            <div class="absolute inset-x-0 top-0 h-px bg-linear-to-r from-transparent via-white/18 to-transparent"></div>
            <h3 class="font-[var(--font-display)] text-xl font-semibold tracking-tight text-white">
              {{ step.title }}
            </h3>
            <p class="mt-3 text-sm leading-7 text-[var(--color-text-secondary)] md:text-[0.95rem]">
              {{ step.description }}
            </p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
